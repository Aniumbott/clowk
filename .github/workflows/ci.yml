name: tests

# clowk claims Python 3.8+ and Windows support. Until this workflow existed, every test had only
# ever run on macOS with Python 3.14 -- so the floor and the Windows paths (os.replace over an open
# file, chmod being a no-op, clip.exe, os.altsep in the deny matcher) were asserted, not tested.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Explicit combinations rather than a full product, because not every pair exists.
      #
      # The declared 3.8 floor runs on Linux and Windows. It is deliberately NOT run on macOS:
      # setup-python has no arm64 build below 3.11, and the x86 macos-13 runner that could provide
      # one no longer gets scheduled on the free tier -- the job sat queued indefinitely and the
      # whole run never completed. macOS gets 3.11 and 3.13 instead. What that leaves uncovered is
      # 3.8-specific behaviour that manifests only on macOS and not on Linux; both are POSIX and
      # clowk's platform-specific code is all in the POSIX-vs-Windows split, so that gap is thin.
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.8" }
          - { os: windows-latest, python: "3.13" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No install step, deliberately: clowk is standard library only. If this workflow ever needs
      # a pip install, that is a bug in clowk, not in the workflow.
      - name: Assert no third-party imports
        shell: bash
        run: |
          python - <<'PY'
          """Resolve every top-level import and check where it actually lives.

          An allowlist of stdlib names would need maintaining forever and would drift between
          Python versions. Asking the import system where a module resolves to does not:
          anything outside the stdlib directory -- i.e. site-packages -- is a dependency.
          """
          import ast, glob, importlib.util, os, sys

          # Anchor on a module that is unambiguously stdlib and pure-Python everywhere, rather than
          # sysconfig: Homebrew reports the symlinked opt/... prefix while origins resolve through
          # Cellar/..., so a prefix compare against sysconfig's answer fails for every stdlib
          # module. realpath on both sides defeats that.
          STDLIB_DIR = os.path.realpath(os.path.dirname(os.__file__))
          VENDOR = ("site-packages", "dist-packages")
          LOCAL = {"clowk", "tests"}
          bad, checked = [], set()

          def resolves_to_stdlib(name):
              if name in sys.builtin_module_names:
                  return True
              try:
                  spec = importlib.util.find_spec(name)
              except (ImportError, ValueError):
                  return False
              if spec is None:
                  return False
              origin = spec.origin or ""
              if origin in ("built-in", "frozen"):
                  return True
              real = os.path.realpath(origin)
              if any(part in real for part in VENDOR):
                  return False
              return real.startswith(STDLIB_DIR + os.sep)

          for path in sorted(glob.glob("clowk/*.py") + glob.glob("tests/*.py") + ["build_rules.py"]):
              for node in ast.walk(ast.parse(open(path, encoding="utf-8").read())):
                  names = []
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      names = [node.module.split(".")[0]]
                  for name in names:
                      if name in LOCAL:
                          continue
                      checked.add(name)
                      if not resolves_to_stdlib(name):
                          bad.append("%s imports %s" % (path, name))

          if bad:
              print("\n".join(sorted(set(bad))))
              sys.exit("third-party import found -- clowk must stay stdlib only")
          print("stdlib only: confirmed across %d distinct imports" % len(checked))
          PY

      - name: Run the suite
        run: python -m unittest discover -s tests -v

      - name: Prompt hook end to end, and no value in either stream
        shell: bash
        run: |
          python - <<'PY'
          """The core promise, exercised as a real hook call on every host: a captured credential's
          raw value must appear in neither stdout nor stderr."""
          import io, json, os, sys, tempfile
          sys.path.insert(0, ".")
          os.environ["CLOWK_VAULT"] = os.path.join(tempfile.mkdtemp(), "vault.json")
          from clowk import clip, hook_prompt, vault

          clip.CANDIDATES = [["clowk-no-such-clipboard-binary"]]
          KEY = "AKIAIOSFODNN7EXAMPLE"
          for host in ("claude-code", "codex", "gemini-cli"):
              out, err = io.StringIO(), io.StringIO()
              payload = {"prompt": "deploy using " + KEY + " now", "cwd": "/tmp/ci"}
              code = hook_prompt.main(["--host", host], io.StringIO(json.dumps(payload)), out, err)
              blob = out.getvalue() + err.getvalue()
              assert KEY not in blob, "%s LEAKED the raw value" % host
              assert "$AWS_ACCESS_KEY_ID" in blob, "%s did not emit the rewrite: %r" % (host, blob)
              assert code == (0 if host == "claude-code" else 2), "%s wrong exit %r" % (host, code)
              print("%-12s blocked, exit %d, no leak" % (host, code))

          assert vault.get("AWS_ACCESS_KEY_ID") == KEY, "value was not filed"

          out, err = io.StringIO(), io.StringIO()
          clean = {"prompt": "refactor clowk/cli.py please", "cwd": "/tmp/ci"}
          assert hook_prompt.main(["--host", "claude-code"], io.StringIO(json.dumps(clean)), out, err) == 0
          assert out.getvalue() == "" and err.getvalue() == "", "a clean prompt was not silent"
          print("clean prompt passes through silently")
          PY

      - name: A lent credential is usable by the command but absent from its output
        shell: bash
        run: |
          python - <<'PY'
          """clowk run's two load-bearing properties, on every platform.

          The command must be able to USE the value, and the value must not come back in the
          output. A test that only checked the second could be passed by lending nothing at all,
          so the first is checked by length rather than by content.
          """
          import io, os, sys, tempfile
          sys.path.insert(0, ".")
          os.environ["CLOWK_VAULT"] = os.path.join(tempfile.mkdtemp(), "vault.json")
          from clowk import runner, vault

          SECRET = "sk_" + "live_4eC39HqLyjWDarjtT1zdp7dc"
          vault.store("STRIPE_KEY", SECRET)

          out, err = io.StringIO(), io.StringIO()
          code = runner.main(["--", sys.executable + ' -c "import os;print(len(os.environ[chr(83)+\'TRIPE_KEY\']))" # $STRIPE_KEY'], out, err)
          assert code == 0, "command failed: %r" % err.getvalue()
          assert out.getvalue().strip() == str(len(SECRET)), \
              "the command could not use the value: %r" % out.getvalue()
          print("usable:  the command saw a %d-character value" % len(SECRET))

          out, err = io.StringIO(), io.StringIO()
          runner.main(["--", "echo $STRIPE_KEY"], out, err)
          blob = out.getvalue() + err.getvalue()
          assert SECRET not in blob, "clowk run LEAKED the value into its own output"
          assert "$STRIPE_KEY" in blob, "the value was not scrubbed back to its name: %r" % blob
          print("not readable: echoing it printed $STRIPE_KEY")

          assert vault.list_secrets()["STRIPE_KEY"]["uses"], "the used-by ledger was not recorded"
          print("ledger:  the use was recorded")
          PY

      - name: Install and uninstall round-trip on a temp settings file
        shell: bash
        run: |
          python - <<'PY'
          """install must merge into settings it did not write, and uninstall must restore it
          exactly -- including on Windows, where os.replace over an existing file behaves
          differently and chmod is a no-op."""
          import copy, json, os, sys, tempfile
          sys.path.insert(0, ".")
          from clowk import install

          settings = os.path.join(tempfile.mkdtemp(), "settings.json")
          original = {
              "theme": "dark",
              "hooks": {
                  "UserPromptSubmit": [{"hooks": [{"type": "command", "command": "echo mine"}]}],
                  "PreToolUse": [{"matcher": "Bash", "hooks": [{"type": "command", "command": "echo theirs"}]}],
              },
          }
          with open(settings, "w", encoding="utf-8") as f:
              json.dump(original, f)

          for host in ("claude-code", "codex", "gemini-cli"):
              # Two hooks everywhere, plus the SessionStart briefing where the host has a session
              # event. Derived from TARGETS, not written as 2 -- a literal here turned all seven
              # jobs red the moment a third hook was added, while checking nothing that mattered.
              expected = 2 + (1 if install.TARGETS[host].get("session_event") else 0)
              before = copy.deepcopy(json.load(open(settings, encoding="utf-8")))
              added = install.install(host, os.getcwd(), settings)["added"]
              assert added == expected, "%s registered %d hooks, expected %d" % (host, added, expected)
              text = json.dumps(json.load(open(settings, encoding="utf-8")))
              assert "echo mine" in text and "echo theirs" in text, "%s clobbered existing hooks" % host
              assert install.install(host, os.getcwd(), settings)["added"] == 0, "%s not idempotent" % host
              install.uninstall(host, settings)
              after = json.load(open(settings, encoding="utf-8"))
              assert after == before, "%s did not round-trip: %r" % (host, after)
              print("%-12s merge, idempotent, exact round-trip" % host)
          PY
